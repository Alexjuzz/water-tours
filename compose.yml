services:
  postgres:
    image: postgres:16
    container_name: tickets_postgres
    environment:
      POSTGRES_USER: water_admin
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata  # монтируем прямо в PGDATA
    ports:
      - "127.0.0.1:5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_admin -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: tickets_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickets_app
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        ipv4_address: 172.28.0.10
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # SMTP now confirmed working (2026-09-07) — safe to turn on real delivery.
      TICKETS_EMAIL_DELIVERY_ENABLED: ${TICKETS_EMAIL_DELIVERY_ENABLED:-true}
      # Required alongside the flag: only orders paid after this instant are delivered
      # automatically. Empty means nothing is delivered (see TicketEmailDeliveryJob).
      TICKETS_EMAIL_DELIVERY_DELIVER_PAID_FROM: ${TICKETS_EMAIL_DELIVERY_DELIVER_PAID_FROM:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      STAFF_USERNAME: ${STAFF_USERNAME}
      STAFF_PASSWORD: ${STAFF_PASSWORD}
      STAFF_REMEMBER_ME_KEY: ${STAFF_REMEMBER_ME_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      # Reversible switch for the Telegram address-failover client. `false` goes back to
      # the JDK client that connected to one resolved address and gave up, which is what
      # made polling fail about two attempts in three on this network.
      TELEGRAM_CONNECTION_FAILOVER: ${TELEGRAM_CONNECTION_FAILOVER:-true}
      STAFF_TELEGRAM_CHAT_IDS: ${STAFF_TELEGRAM_CHAT_IDS}
      SUPPORT_OWNER_TELEGRAM_CHAT_ID: ${SUPPORT_OWNER_TELEGRAM_CHAT_ID:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Cross-origin callers of the public API. The two production origins by default; a local
      # WordPress (http://water-tours.local) must be listed here explicitly. Never leave this
      # empty - an empty list denies every cross-origin call, including the real storefront.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://water-tours.ru,https://www.water-tours.ru}
      # Docker Desktop's host-to-container port forwarding arrives from this fixed bridge
      # gateway address rather than loopback; only relevant when local-checkout is active.
      LOCAL_CHECKOUT_TRUSTED_REMOTE_ADDRESSES: 172.28.0.1
      # --- Transport / trust boundary ---------------------------------------------------
      # compose.yml enumerates the container environment, so a name that is not listed here can
      # NOT be set from .env - it never reaches the app. Everything below is wired for exactly
      # that reason, and every default repeats the application.yml default, so adding these
      # lines changes no running behaviour on its own.
      #
      # Kill switch for the RemoteIpValve. `none` reverts to the pre-remediation behaviour
      # (no client address, no Secure cookies, no HSTS) without a rebuild.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-native}
      # KEEP IN SYNC with server.tomcat.remoteip.internal-proxies in application.yml. An empty
      # value here would trust NOTHING and silently disable the valve, so it has a real default
      # rather than `:-`.
      TRUSTED_PROXIES: '${TRUSTED_PROXIES:-127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1|172\.28\.0\.1|172\.17\.0\.1}'
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      # --- Schema ------------------------------------------------------------------------
      # Stays `update`. Moving to `validate` needs the drill in ops/security/DDL-VALIDATE-DRILL.md
      # run against the real schema first; wired so that move needs no rebuild.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      # --- Order creation rate limit -----------------------------------------------------
      # OFF until a live check confirms the backend sees the real client address. Enabling it
      # while every request collapses to one key would throttle the whole storefront.
      ORDER_RATE_LIMIT_ENABLED: ${ORDER_RATE_LIMIT_ENABLED:-false}
      ORDER_RATE_LIMIT_MAX: ${ORDER_RATE_LIMIT_MAX:-20}
      ORDER_RATE_LIMIT_WINDOW: ${ORDER_RATE_LIMIT_WINDOW:-10m}
      # --- Customer support --------------------------------------------------------------
      # Kill switch that KEEPS the chat id above; set to false to stop the channel without
      # losing the destination.
      SUPPORT_ENABLED: ${SUPPORT_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pgdata:
  redisdata:
