spring:
  datasource:
    url: jdbc:postgresql://localhost:5439/appdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:redis}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.yandex.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
yookassa:
  shopId: ${YOOKASSA_SHOP_ID}
  secretKey: ${YOOKASSA_SECRET_KEY}

idempotency:
  value-ttl: 10m
  lock-ttl: 45s
  wait-timeout: 3s
  poll-interval: 100ms
app:
  base-url: http://localhost:8080
  mail-from: ${MAIL_USERNAME}
order:
  expiration-timeout: 30m          # заказы в PENDING_PAYMENT старше 30 минут → EXPIRED
  expiration-check-interval: 300000 # проверка каждые 5 минут (в миллисекундах)
staff:
  username: ${STAFF_USERNAME:staff}
  password: ${STAFF_PASSWORD:staff12345}
  remember-me-key: ${STAFF_REMEMBER_ME_KEY:change-me-in-production-please}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized   # детали только авторизованным
  health:
    db:
      enabled: true
    redis:
      enabled: true
