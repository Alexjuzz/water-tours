# Recovery stack only. Plain HTTP on purpose - this is meant to be reached over a local port
# forward, never published. Put TLS in front before any non-local use.

# The order access token is the only authorisation an order has, and it travels in the query
# string of the PDF and status URLs (links already sent to customers and into Telegram chats keep
# working that way). Default access logs record the full request line, so the token would be
# written to disk on every download. This format drops the query string for the order API.
map $request_uri $loggable_uri {
    default              $request_uri;
    "~^(?<path>[^?]*)\?" $path;
}
# The Referer needs exactly the same treatment, and for exactly the same reason. A browser that
# follows a link out of a page whose own URL carried `?accessToken=...` - which every PDF and
# status link issued before the header change does - sends that whole URL here. Logging it raw
# would put the token on disk from a different direction after the request line had been cleaned.
map $http_referer $loggable_referer {
    default                 $http_referer;
    "~^(?<referer>[^?]*)\?" $referer;
}
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$loggable_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    root /var/www/html;
    index index.php;

    access_log /var/log/nginx/access.log redacted;

    # The local-checkout surface must never be reachable, even if the profile is switched on by
    # accident. The application refuses to start with that profile outside localhost as well;
    # these two rules are the second half of the same guard.
    location ^~ /api/v1/local-checkout/ {
        deny all;
    }
    location = /checkout.html {
        deny all;
    }

    # The test-payment endpoint does NOT live under /api/v1/local-checkout/. It is
    # POST|GET /api/v1/orders/{uuid}/test-pay on the ordinary order path, so the two rules above
    # never covered it and the "defence in depth" claim did not hold for the one endpoint that
    # marks an order paid without money. Regex locations are matched in source order, so this must
    # stay above the backend location below.
    location ~ ^/api/v1/orders/[^/]+/test-pay$ {
        deny all;
    }

    # Staff pages are Spring, not WordPress. Without `staff` here they fell through to
    # `location /` and were answered by WordPress - a 404 where the console should be. Each
    # alternative is anchored with (/|$) so /staff and /staff/prices both match while
    # /staffroom does not.
    location ~ ^/(api/v1(/|$)|t/|actuator(/|$)|login(/|$)|logout(/|$)|staff(/|$)) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # REPLACE, not append. `$proxy_add_x_forwarded_for` keeps whatever the client sent in
        # front of the observed address; the backend reads this list right-to-left so either
        # spelling is safe, but replacing leaves nothing attacker-controlled in the header at all.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
