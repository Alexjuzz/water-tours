services:
  postgres:
    image: postgres:16
    container_name: dr_postgres
    environment:
      POSTGRES_USER: water_admin
      POSTGRES_PASSWORD: ${DR_DB_PASSWORD:?set DR_DB_PASSWORD in .env}
      POSTGRES_DB: appdb
    volumes:
      - dr_pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, and overridable: a recovery drill has to be able to run beside a
      # development database that already holds 5439.
      - "127.0.0.1:${DR_POSTGRES_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water_admin -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: dr_redis
    volumes:
      - dr_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: dr_app
    ports:
      - "127.0.0.1:${DR_APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/appdb
      SPRING_DATASOURCE_USERNAME: water_admin
      SPRING_DATASOURCE_PASSWORD: ${DR_DB_PASSWORD:?set DR_DB_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: redis
      MAIL_USERNAME: ${MAIL_USERNAME:-not-configured-yet@example.invalid}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-not-configured-yet}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-not-configured-yet}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-not-configured-yet}
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      STAFF_PASSWORD: ${STAFF_PASSWORD:?set STAFF_PASSWORD in .env}
      STAFF_REMEMBER_ME_KEY: ${STAFF_REMEMBER_ME_KEY:?set STAFF_REMEMBER_ME_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      STAFF_TELEGRAM_CHAT_IDS: ${STAFF_TELEGRAM_CHAT_IDS:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # A recovery instance has no SMTP by design - the mail credentials are deliberately not
      # part of a backup. Leaving the mail health indicator on makes /actuator/health answer 503
      # and the container sit at "unhealthy" for ever on a recovery that is working perfectly,
      # which trains whoever is recovering the site to ignore the health signal.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "${DR_MAIL_HEALTH_ENABLED:-false}"
      # The default profile allows only the two production origins; a recovery instance is
      # reached at a different one.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    container_name: dr_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:?set WORDPRESS_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD in .env}
    volumes:
      - dr_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.2-fpm
    container_name: dr_wordpress
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - dr_wp_core:/var/www/html
      # water-tours-river is the ACTIVE production theme. Without it here, a recovery restores
      # the database (which names river as the active theme) onto a stack that does not contain
      # it, and WordPress falls back to whatever else it can find. water-tours-prototype stays
      # as the documented rollback target.
      - ../../integrations/wordpress/themes/water-tours-river:/var/www/html/wp-content/themes/water-tours-river
      - ../../integrations/wordpress/themes/water-tours-prototype:/var/www/html/wp-content/themes/water-tours-prototype
      - ../../integrations/wordpress/water-tours-buy:/var/www/html/wp-content/plugins/water-tours-buy
      - dr_wp_uploads:/var/www/html/wp-content/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: dr_nginx
    ports:
      # Loopback only. This stack serves the whole site over plain HTTP with no TLS in front, so
      # it is reached through an SSH port forward, never published. Publishing it would need TLS
      # and a real review first.
      - "127.0.0.1:${DR_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - dr_wp_core:/var/www/html:ro
      - ../../integrations/wordpress/themes/water-tours-river:/var/www/html/wp-content/themes/water-tours-river:ro
      - ../../integrations/wordpress/themes/water-tours-prototype:/var/www/html/wp-content/themes/water-tours-prototype:ro
      - ../../integrations/wordpress/water-tours-buy:/var/www/html/wp-content/plugins/water-tours-buy:ro
      - dr_wp_uploads:/var/www/html/wp-content/uploads:ro
    depends_on:
      - wordpress
      - app
    restart: unless-stopped

volumes:
  dr_pgdata:
  dr_redisdata:
  dr_mariadb:
  dr_wp_core:
  dr_wp_uploads:
